name: Build and package the app for all platforms

on:
  push:
    branches:
    - master
    - develop

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jlha-utils

      - name: Build and package
        run: |
          docker pull sacredbanana/amiga-compiler:ppc-morphos-old
          docker tag sacredbanana/amiga-compiler:ppc-morphos-old sacredbanana/amiga-compiler:ppc-morphos
          sudo ./package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmigaGPT
          path: out/AmigaGPT.lha
